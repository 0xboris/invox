# golangci-lint v2. CI pins the version in .github/workflows/ci.yml; run it
# locally with `make lint`. internal/archtest asserts the same import rules on
# the transitive import graph.
version: "2"

run:
  go: "1.24"
  relative-path-mode: gomod

linters:
  default: none
  enable:
    # gh's set.
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - govet
    - ineffassign
    - nilerr
    - nolintlint
    - nosprintfhostport
    - reassign
    - unused
    # Added for invox.
    - staticcheck
    - errcheck
    - gosec
    - depguard
    - forbidigo

  settings:
    depguard:
      rules:
        # The package table of docs/design/target/README.md, one rule per row,
        # for each file's direct imports. internal/archtest checks the same
        # table on the transitive import graph. Tests may import anything.
        #
        # Entities: invoice imports only money; numbering, epc and money
        # only the standard library. None of the core touches the disk.
        entities-invoice:
          list-mode: strict
          files:
            - "**/internal/invoice/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/money
        entities-leaves:
          list-mode: strict
          files:
            - "**/internal/numbering/**"
            - "**/internal/epc/**"
            - "**/internal/money/**"
            - "!$test"
          allow:
            - $gostd
        core-no-disk:
          files:
            - "**/internal/invoice/**"
            - "**/internal/numbering/**"
            - "**/internal/epc/**"
            - "**/internal/money/**"
            - "**/internal/billing/**"
            - "!$test"
          deny:
            - pkg: os
              desc: the core touches no disk; a port does
            - pkg: io/fs
              desc: the core touches no disk; a port does
            - pkg: net
              desc: the core touches no network
            - pkg: syscall
              desc: the core makes no system calls
        # Use cases: billing imports only the entities.
        use-cases:
          list-mode: strict
          files:
            - "**/internal/billing/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/invoice
            - github.com/0xboris/invox/internal/numbering
            - github.com/0xboris/invox/internal/epc
            - github.com/0xboris/invox/internal/money
            - github.com/0xboris/invox/internal/billing
        # Use cases hand paths to the adapters; they never build one.
        use-cases-no-paths:
          files:
            - "**/internal/billing/**"
            - "!$test"
          deny:
            - pkg: path$
              desc: a driven adapter builds paths
            - pkg: path/filepath
              desc: a driven adapter builds paths
        # Driven adapters implement billing's ports.
        driven-store:
          list-mode: strict
          files:
            - "**/internal/store/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/invoice
            - github.com/0xboris/invox/internal/numbering
            - github.com/0xboris/invox/internal/epc
            - github.com/0xboris/invox/internal/money
            - github.com/0xboris/invox/internal/billing
            - github.com/0xboris/invox/internal/config
            - github.com/0xboris/invox/internal/fsutil
            - gopkg.in/yaml.v3
        driven-files:
          list-mode: strict
          files:
            - "**/internal/archive/**"
            - "**/internal/render/**"
            - "**/internal/email/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/invoice
            - github.com/0xboris/invox/internal/numbering
            - github.com/0xboris/invox/internal/epc
            - github.com/0xboris/invox/internal/money
            - github.com/0xboris/invox/internal/billing
            - github.com/0xboris/invox/internal/fsutil
        driven-programs:
          list-mode: strict
          files:
            - "**/internal/adapters/tectonic/**"
            - "**/internal/adapters/applemail/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/invoice
            - github.com/0xboris/invox/internal/numbering
            - github.com/0xboris/invox/internal/epc
            - github.com/0xboris/invox/internal/money
            - github.com/0xboris/invox/internal/billing
            - github.com/0xboris/invox/internal/adapters/run
            - github.com/0xboris/invox/internal/iostreams
        # Driving adapters call the use cases and never reach a driven
        # adapter, config, fsutil or the factory.
        driving:
          list-mode: strict
          files:
            - "**/internal/cli/**"
            - "**/internal/cmd/**"
            - "**/internal/tableprinter/**"
            - "**/internal/adapters/editor/**"
            - "**/internal/adapters/opener/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/invoice
            - github.com/0xboris/invox/internal/numbering
            - github.com/0xboris/invox/internal/epc
            - github.com/0xboris/invox/internal/money
            - github.com/0xboris/invox/internal/billing
            - github.com/0xboris/invox/internal/cli
            - github.com/0xboris/invox/internal/cmd
            - github.com/0xboris/invox/internal/tableprinter
            - github.com/0xboris/invox/internal/adapters/editor
            - github.com/0xboris/invox/internal/adapters/opener
            - github.com/0xboris/invox/internal/adapters/run
            - github.com/0xboris/invox/internal/iostreams
            - github.com/0xboris/invox/internal/env
            - github.com/0xboris/invox/internal/build
            - github.com/spf13/cobra
            - github.com/spf13/pflag
        # Main: factory builds everything, but never the CLI root or a
        # command.
        main-factory:
          files:
            - "**/internal/factory/**"
          deny:
            - pkg: github.com/0xboris/invox/internal/cli$
              desc: the CLI root uses the Factory; the Factory does not use it
            - pkg: github.com/0xboris/invox/internal/cmd
              desc: commands use the Factory; the Factory does not use them
        main-invox:
          list-mode: strict
          files:
            - "**/cmd/invox/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/factory$
            - github.com/0xboris/invox/internal/cli$
            - github.com/0xboris/invox/internal/iostreams
            - github.com/0xboris/invox/internal/env
            - github.com/0xboris/invox/internal/adapters/run
        main-docs-gen:
          list-mode: strict
          files:
            - "**/internal/docs/gen/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/factory$
            - github.com/0xboris/invox/internal/cli$
            - github.com/0xboris/invox/internal/cli/cmdutil
            - github.com/0xboris/invox/internal/cli/helptext
            - github.com/0xboris/invox/internal/fsutil
            - github.com/0xboris/invox/internal/iostreams
            - github.com/0xboris/invox/internal/env
            - github.com/0xboris/invox/internal/adapters/run
            - github.com/spf13/cobra$
        # Libraries import only the standard library.
        libraries:
          list-mode: strict
          files:
            - "**/internal/config/**"
            - "**/internal/fsutil/**"
            - "**/internal/adapters/run/**"
            - "**/internal/iostreams/**"
            - "**/internal/env/**"
            - "**/internal/build/**"
            - "!**/internal/adapters/run/runtest/**"
            - "!$test"
          allow:
            - $gostd
        # runtest is test support: a Runner stub on run and the standard
        # library.
        test-support:
          list-mode: strict
          files:
            - "**/internal/adapters/run/runtest/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/adapters/run$
        # testfixture is test support: fixture files and their writers on the
        # standard library, so the tests of every package can use it.
        test-fixtures:
          list-mode: strict
          files:
            - "**/internal/testfixture/**"
            - "!$test"
          allow:
            - $gostd
        # Only the CLI knows about flags. A test may define a flag such as
        # -update.
        flags-in-the-cli:
          files:
            - $all
            - "!**/cmd/invox/**"
            - "!**/internal/cli/**"
            - "!**/internal/cmd/**"
            - "!**/internal/docs/gen/**"
            - "!**/internal/factory/**"
            - "!$test"
          deny:
            - pkg: flag
              desc: only commands know about flags
        # internal/adapters/run is the only package that starts programs.
        only-run-execs:
          files:
            - $all
            - "!**/internal/adapters/run/run.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: start programs through run.Runner
        # The docs generator is a dev tool; the release binary must not
        # import it.
        docs-gen-is-a-tool:
          files:
            - $all
            - "!**/internal/docs/gen/**"
          deny:
            - pkg: github.com/0xboris/invox/internal/docs/gen
              desc: the release binary must not import the docs generator
        # Only tests and factorytest use the Runner stub; the release binary
        # must not contain it.
        runtest-is-for-tests:
          files:
            - $all
            - "!**/internal/factory/factorytest/**"
            - "!**/internal/clitest/**"
            - "!$test"
          deny:
            - pkg: github.com/0xboris/invox/internal/adapters/run/runtest
              desc: the Runner stub is for tests; the release binary must not import it
        # clitest is test support: it runs the CLI on a Factory from
        # factorytest.
        test-cli:
          list-mode: strict
          files:
            - "**/internal/clitest/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/cli$
            - github.com/0xboris/invox/internal/factory/factorytest$
            - github.com/0xboris/invox/internal/adapters/run$
            - github.com/0xboris/invox/internal/adapters/run/runtest$
            - github.com/0xboris/invox/internal/iostreams$
            - github.com/0xboris/invox/internal/testfixture$
        clitest-is-for-tests:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/0xboris/invox/internal/clitest
              desc: clitest is for tests; the release binary must not import it
        testfixture-is-for-tests:
          files:
            - $all
            - "!**/internal/clitest/**"
            - "!$test"
          deny:
            - pkg: github.com/0xboris/invox/internal/testfixture
              desc: fixtures are for tests; the release binary must not import them

    errcheck:
      exclude-functions:
        # Writes to IOStreams. A failed write to the terminal or a pipe has no
        # recovery, and the next write or the exit code reports it.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: write to the injected IOStreams
        - pattern: ^os\.Exit$
          msg: return an error; cli.Main picks the exit code and main exits
        - pattern: ^os\.(Stdin|Stdout|Stderr)$
          msg: use the injected IOStreams; only iostreams.System touches the process streams
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: read env.Env; only env.System reads the process environment
        - pattern: ^time\.Now$
          msg: use env.Env.Now; only env.System reads the clock
        - pattern: ^runtime\.GOOS$
          msg: use env.Env.GOOS; only env.System reads runtime.GOOS
        - pattern: ^exec\.Command(Context)?$
          pkg: ^os/exec$
          msg: start programs through run.Runner
        - pattern: ^os\.StartProcess$
          msg: start programs through run.Runner
        - pattern: ^syscall\.Exit$
          msg: return an error; cli.Main picks the exit code and main exits
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: write to the injected IOStreams and return errors

    gosec:
      excludes:
        # Reading the files the user names (invoices, config, templates) is
        # what invox does. G703 is the taint-analysis form of G304.
        - G304
        - G703

    staticcheck:
      checks:
        # golangci-lint's default set.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan rewrites of !(a && b) are not clearer.
        - -QF1001

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # Tests may use the process streams, environment and clock, exit from
      # TestMain and helper processes, and write fixtures with any mode.
      - path: _test\.go$
        linters: [forbidigo, gosec]
      # testfixture is test support and writes fixtures as tests do.
      - path: ^internal/testfixture/
        linters: [gosec]
      # The composition root: main exits with cli.Main's code.
      - path: ^cmd/invox/main\.go$
        linters: [forbidigo]
        text: "`os\\.Exit`"
      # The docs generator is a dev tool with its own main.
      - path: ^internal/docs/gen/main\.go$
        linters: [forbidigo]
        text: "`os\\.Exit`"
      # env.System reads the process environment, the clock and GOOS.
      - path: ^internal/env/env\.go$
        linters: [forbidigo]
        text: "`(os\\.Getenv|time\\.Now|runtime\\.GOOS)`"
      # iostreams.System wraps the process streams; newSystem reads
      # INVOX_FORCE_TTY.
      - path: ^internal/iostreams/iostreams\.go$
        linters: [forbidigo]
        text: "`(os\\.(Stdin|Stdout|Stderr)|os\\.Getenv)`"
      # TIOCGETA/TCGETS through syscall.Syscall needs unsafe.Pointer.
      - path: ^internal/iostreams/terminal_ioctl\.go$
        linters: [gosec]
        text: G103
      # syscall.Umask returns a 0-0777 mask, so the conversion can't overflow.
      - path: ^internal/fsutil/umask_unix\.go$
        linters: [gosec]
        text: G115
      # SilentError and CancelError keep gh's cmdutil names.
      - path: ^internal/cli/cmdutil/errors\.go$
        linters: [staticcheck]
        text: ST1012

formatters:
  enable:
    - gofmt
