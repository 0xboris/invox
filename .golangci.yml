# golangci-lint v2. CI pins the version in .github/workflows/ci.yml; run it
# locally with `make lint`. internal/archtest asserts the same import rules on
# the transitive import graph, and tools/archcheck.py the kit's layers.
version: "2"

run:
  go: "1.24"
  relative-path-mode: gomod

linters:
  default: none
  enable:
    # gh's set.
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - govet
    - ineffassign
    - nilerr
    - nolintlint
    - nosprintfhostport
    - reassign
    - unused
    # Added for invox.
    - staticcheck
    - errcheck
    - gosec
    - depguard
    - forbidigo

  settings:
    depguard:
      rules:
        # Imports point down: cmd -> app -> features -> sharedui and domain ->
        # utilities. Adapters implement the domain's ports, and only app
        # imports them. Nothing below the commands knows about commands,
        # flags or the CLI. tools/archcheck.py checks the same layers from
        # architecture.json.
        below-commands:
          files:
            - "**/internal/adapters/**"
            - "**/internal/domain/**"
            - "**/internal/utilities/**"
            - "**/internal/sharedui/tableprinter/**"
          deny:
            - pkg: github.com/0xboris/invox/cmd
              desc: imports point down only
            - pkg: github.com/0xboris/invox/internal/app
              desc: the composition root sits above this package
            - pkg: github.com/0xboris/invox/internal/features
              desc: commands sit above this package
            - pkg: github.com/spf13/cobra
              desc: only commands know about cobra
            - pkg: github.com/spf13/pflag
              desc: only commands know about flags
        # Same layer, without tests: a test may define a flag such as -update.
        below-commands-flag:
          files:
            - "**/internal/adapters/**"
            - "**/internal/domain/**"
            - "**/internal/utilities/**"
            - "**/internal/sharedui/tableprinter/**"
            - "!$test"
          deny:
            - pkg: flag
              desc: only commands know about flags
        # The domain returns data and typed errors. It neither writes to the
        # terminal nor runs programs; it reaches files and programs through
        # the ports in internal/domain/ports. Its tests may use the real
        # file system adapter.
        domain:
          files:
            - "**/internal/domain/**"
            - "!$test"
          deny:
            - pkg: github.com/0xboris/invox/internal/utilities/iostreams
              desc: return data; the command renders it
            - pkg: github.com/0xboris/invox/internal/sharedui
              desc: return data; the command renders it
            - pkg: github.com/0xboris/invox/internal/adapters
              desc: declare a port in internal/domain/ports; app passes the adapter in
        # Adapters implement the domain's ports on top of run.Runner, the
        # file system and the process; they know nothing else of the domain.
        adapters:
          list-mode: strict
          files:
            - "**/internal/adapters/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/domain/ports
            - github.com/0xboris/invox/internal/adapters/programs/run
            - github.com/0xboris/invox/internal/utilities
        # Shared UI holds no business rules, so it imports no domain package.
        sharedui:
          list-mode: strict
          files:
            - "**/internal/sharedui/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/utilities
            - github.com/spf13/cobra
            - github.com/spf13/pflag
        # Leaf packages. Each states the only module packages it may import.
        stdlib-only:
          list-mode: strict
          files:
            - "**/internal/adapters/buildinfo/**"
            - "**/internal/domain/email/**"
            - "**/internal/domain/epc/**"
            - "**/internal/domain/money/**"
            - "**/internal/domain/ports/**"
            - "**/internal/utilities/**"
            - "!$test"
          allow:
            - $gostd
        domain-latex:
          list-mode: strict
          files:
            - "**/internal/domain/latex/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/domain/money
        domain-archive:
          list-mode: strict
          files:
            - "**/internal/domain/archive/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/0xboris/invox/internal/domain/ports
        # internal/adapters/programs/run is the only package that starts programs.
        only-run-execs:
          files:
            - $all
            - "!**/internal/adapters/programs/run/run.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: start programs through run.Runner
        # The docs generator is a dev tool; the release binary must not
        # import it.
        docs-gen-is-a-tool:
          files:
            - $all
            - "!**/internal/docs/gen/**"
          deny:
            - pkg: github.com/0xboris/invox/internal/docs/gen
              desc: the release binary must not import the docs generator

    errcheck:
      exclude-functions:
        # Writes to IOStreams. A failed write to the terminal or a pipe has no
        # recovery, and the next write or the exit code reports it.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: write to the injected IOStreams
        - pattern: ^os\.Exit$
          msg: return an error; cli.Main picks the exit code and main exits
        - pattern: ^os\.(Stdin|Stdout|Stderr)$
          msg: use the injected IOStreams; only platform.Streams touches the process streams
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: read env.Env; only platform.Env reads the process environment
        - pattern: ^time\.Now$
          msg: use env.Env.Now; only platform.Env reads the clock
        - pattern: ^runtime\.GOOS$
          msg: use env.Env.GOOS; only platform.Env reads runtime.GOOS
        - pattern: ^exec\.Command(Context)?$
          pkg: ^os/exec$
          msg: start programs through run.Runner
        - pattern: ^os\.StartProcess$
          msg: start programs through run.Runner
        - pattern: ^syscall\.Exit$
          msg: return an error; cli.Main picks the exit code and main exits
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: write to the injected IOStreams and return errors

    gosec:
      excludes:
        # Reading the files the user names (invoices, config, templates) is
        # what invox does. G703 is the taint-analysis form of G304.
        - G304
        - G703

    staticcheck:
      checks:
        # golangci-lint's default set.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan rewrites of !(a && b) are not clearer.
        - -QF1001

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # Tests may use the process streams, environment and clock, exit from
      # TestMain and helper processes, and write fixtures with any mode.
      - path: _test\.go$
        linters: [forbidigo, gosec]
      # The composition root: main exits with cli.Main's code.
      - path: ^cmd/invox/main\.go$
        linters: [forbidigo]
        text: "`os\\.Exit`"
      # The docs generator is a dev tool with its own main.
      - path: ^internal/docs/gen/main\.go$
        linters: [forbidigo]
        text: "`os\\.Exit`"
      # platform.Env reads the process environment, the clock and GOOS;
      # platform.Streams wraps the process streams and reads INVOX_FORCE_TTY.
      - path: ^internal/adapters/platform/platform\.go$
        linters: [forbidigo]
        text: "`(os\\.(Getenv|Stdin|Stdout|Stderr)|time\\.Now|runtime\\.GOOS)`"
      # TIOCGETA/TCGETS through syscall.Syscall needs unsafe.Pointer.
      - path: ^internal/adapters/platform/terminal_ioctl\.go$
        linters: [gosec]
        text: G103
      # syscall.Umask returns a 0-0777 mask, so the conversion can't overflow.
      - path: ^internal/adapters/fsutil/umask_unix\.go$
        linters: [gosec]
        text: G115
      # The template placeholder table names its column Token; the values
      # are placeholders such as @@EPC_QR_CODE@@, not credentials.
      - path: ^internal/domain/schema/schema\.go$
        linters: [gosec]
        text: G101
      # SilentError and CancelError keep gh's cmdutil names.
      - path: ^internal/sharedui/cmdutil/errors\.go$
        linters: [staticcheck]
        text: ST1012

formatters:
  enable:
    - gofmt
