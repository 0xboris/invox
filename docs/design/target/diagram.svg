<svg xmlns="http://www.w3.org/2000/svg" class="uml-target" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="Target UML package diagram for invox after a Clean Architecture refactor. Entities (invoice, numbering, epc, money) sit at the center and import nothing but money. The billing package holds the use cases in a Service and owns six interfaces: Invoices, Directory, Archive, Renderer, Compiler, Mailer. Driven adapters (store, archive, render/latex, adapters/tectonic, email, adapters/applemail) implement those interfaces. Driving adapters (cli, the commands, cmdutil, helptext, tableprinter, editor, opener) call the Service. The factory package in the main ring builds everything. Only the outer rings import libraries."><style>
svg{--bg:#ffffff;--surface:#ffffff;--fg:#18202b;--muted:#5a6575;--accent:#1d5c8f;--accent-soft:#e2edf7;--r-main:#6b5ca5;--r-adapt:#1f7a8c;--r-use:#1d5c8f;--r-ent:#9a5b00;--r-lib:#5a6575;color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:currentColor}
.ring rect{fill:none;stroke:var(--hue);stroke-width:1.3;stroke-dasharray:6 4}
.ring .rl{font-family:system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--hue)}
.r-main,.c-main{--hue:var(--r-main)}.r-adapt,.c-adapt{--hue:var(--r-adapt)}.r-use,.c-use{--hue:var(--r-use)}.r-ent,.c-ent{--hue:var(--r-ent)}.r-lib,.c-lib{--hue:var(--r-lib)}
.pkg rect{fill:var(--surface);stroke:var(--hue);stroke-width:1.3}
.pkg .tab{fill:var(--hue);fill-opacity:.2;stroke:var(--hue);stroke-width:1.3}
.c-use>rect{fill:var(--accent-soft);fill-opacity:.35}.c-use>text.n{font-weight:600;fill:var(--r-use)}
text.n{font-size:12px}text.b{font-weight:600}text.s{font-size:10px;fill:var(--muted)}text.st{font-size:9.5px;fill:var(--muted)}text.op{font-size:11.5px}text.el{font-size:10.5px;fill:var(--muted)}text.none{font-size:11px;fill:var(--muted);font-style:italic}
.cls rect{fill:var(--surface);stroke:var(--r-use);stroke-width:1.3}.cls line{stroke:var(--r-use)}
.port rect{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.dep{fill:none;stroke:currentColor;stroke-opacity:.75;stroke-width:1.1;stroke-dasharray:5 3}
.real{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:6 3}
.halo{fill:none;stroke:var(--surface);stroke-width:5}
.mk{fill:none;stroke:currentColor;stroke-width:1.4}.mkt{fill:var(--surface);stroke:var(--accent);stroke-width:1.3}
